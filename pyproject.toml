[project]
name = "vouch"
version = "0.0.1"
description = "Evidence-backed engineer capability profiles, grounded in real commits and local session telemetry."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Lazy-imported behind JudgeProvider; no free tier, which may train on the diffs we send.
providers = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
vouch = "vouch.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "vouch",
    "vouch.ingest",
    "vouch.l1",
    "vouch.l2",
    "vouch.l3",
    "vouch.l4",
    "vouch.l5",
    "vouch.eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in prompts/tests are fine
