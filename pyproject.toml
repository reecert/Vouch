[project]
name = "vouch"
version = "0.0.1"
description = "Evidence-backed capability reports for engineers, grounded in real commits. v0: ownership only."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Provider SDKs are lazy-imported behind JudgeProvider — install only what you use.
# The deterministic core (ingest/extract) and the test suite need none of these.
providers = [
    "google-genai>=0.3",
    "groq>=0.11",
    "ollama>=0.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
vouch = "cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["vouch", "vouch.ingest", "vouch.extract", "vouch.judge", "vouch.report", "vouch.eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines in prompts/tests are fine
