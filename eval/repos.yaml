# ---------------------------------------------------------------------------------------
notes:
  aliases: >
    Every `aliases:` list is EMPTY on purpose, and that is a choice with consequences.
    Claiming an alias set would raise the subject's commit count and change every
    denominator, so populating it here would be quietly editing the evidence. Left empty,
    `unresolved_identity_aliases` fires (WARN, understates) on pytest, sqlite-utils and
    pyinfra, and the judge is told the count is a floor. If a later pass claims them, that
    is a different corpus and the labels do not transfer.

  finding_solo_threshold: >
    NOT A CODE CHANGE — reported, not acted on, because phase 1f adds no features.
    `Detection.solo_authorship_share` is 0.95. Across every real public repo probed for
    this corpus, essentially nothing reaches it: funcy 94%, hynek/doc2dash 94%,
    sqlite-utils 89%, django-cacheops 84%, shot-scraper 89%. Real single-maintainer
    projects accumulate drive-by contributors and land in the 84-94% band. The two repos
    that DO fire (98%, 99%) were found only by searching for them specifically. So in
    practice `solo_repo` fires on fixtures and near-never on the histories users will
    actually connect, and `ownership_loop` is reported unsuppressed for maintainers whose
    ownership number is nearly as meaningless as a true solo repo's. sqlite-utils is in
    the corpus precisely to put a label on that band. Do not retune the threshold before
    the labels exist — the labels are the evidence for what it should be.

  finding_commit_scoping_resolution: >
    ALSO REPORTED, NOT ACTED ON. `commit_scoping` is a median count of significant files
    per commit. Now that all ten rows have been extracted, it takes three values across the
    corpus: 1.0 on five (svcs, flask, unp, records, pyinfra), 2.0 on four (httpx, hunter,
    sqlite-utils, pytest) and 2.5 on one (black — a median over an even count need not be an
    integer). An earlier partial probe recorded "1.0 on eight of ten, 2.0 on httpx"; that was
    written before the six large rows were extracted and is superseded by this. The concern
    survives in weaker form: three values over ten real repos is coarse, so `scope_control` —
    which rests on this fact plus one L2 metric — has little room to discriminate between
    candidates. Worth knowing BEFORE reading its agreement number, so that a high
    exact-agreement score on `scope_control` is not mistaken for the dimension working.

  prediction_scope_control_agreement: >
    A PREDICTION, RECORDED BEFORE ANY LABEL EXISTS so that it cannot be rationalised
    afterwards: whatever agreement number `scope_control` scores in phase 1f, that number
    is NOT INTERPRETABLE as evidence that the dimension works. The reason is in
    notes.finding_commit_scoping_resolution — `commit_scoping` takes three distinct values
    (1.0, 2.0, 2.5) across ten real repos, and five of the ten share the single value 1.0.
    A fact that coarse cannot separate candidates, so the labels it feeds will themselves
    cluster, and a judge that lands on the modal band every time will score high exact
    agreement while discriminating nothing. High agreement here is therefore consistent
    with the dimension being inert, and cannot distinguish the two.
    What would distinguish them, and what to report instead of a bare agreement figure:
    (a) agreement measured against the majority-class baseline — the score from always
    predicting the most common `scope_control` label — with the dimension counted as
    working only if it beats that baseline by a margin the n supports; (b) the confusion
    matrix, not the diagonal, showing whether any non-modal label is ever predicted
    correctly; (c) the same two numbers for a dimension resting on a finer fact, as a
    control on the harness itself.
    If this prediction is wrong — if `scope_control` shows real spread across bands — that
    is a genuine finding about the fact's resolution and should be recorded as one. The
    prediction is here to make that outcome falsifiable, not to pre-empt it.

  confounds_not_covered: >
    The five requested axes leave four of L1's nine detectors unexercised:
    `bot_dominated`, `vendored_or_generated_bulk`, `rebase_rewritten_authorship` and
    `shallow_history`. Nothing in this corpus licenses a claim about the judge's behaviour
    when those fire. Candidates seen while probing, if a later pass wants them:
    simonw/til (27% bot commits) and psf/black (9%).

  cost: >
    Full `extract_facts` is dominated by blame. Measured on these clones, all ten rows:
    records 0.0s, unp 1.9s, svcs 42.5s, flask 55.0s, httpx 134.5s, sqlite-utils 135.1s,
    black 193.3s, hunter 323.0s, pyinfra 484.5s, pytest 1249.9s. Roughly 45 minutes for a
    full corpus pass, and cost tracks subject commits x history size rather than either
    alone — pytest is 21 minutes on its own. The labeling harness must persist L1 output
    rather than re-extract per session; re-extracting is not a thing a human can sit
    through between labels.

  privacy: >
    SETTLED before this file was first committed, so no third-party address is anywhere in
    this repository's history. An earlier draft stored the ten addresses inline and flagged
    the problem for a decision; the decision is a runtime resolver. Each row carries a
    selector — `commit_rank` at the pinned head, guarded by `email_sha256` — and
    `vouch.eval.corpus.resolve_author` reads the address out of the clone when the pipeline
    needs it. Masking (`vouch.l1.confounds.mask_email`) was the other candidate and does not
    work here: a masked address cannot select commits, and six of the ten have no
    `users.noreply` alternative to substitute. The digest is a consistency guard, NOT a
    privacy claim — anyone with the clone can match it in seconds, which is exactly what the
    resolver does. What the digest buys is a loud failure: if the ranking shifts under the
    corpus, resolution raises instead of silently profiling a different person. What it
    costs: reading this file no longer tells you who a row is about without a clone.
    STILL OPEN, and the same leak by another door: `eval/labels.yaml` stores `author:` as a
    plain address, and the labels are committed. It is empty today, so nothing has leaked
    yet, but the first label written through the CLI puts an address in history. Either the
    label schema keys on the corpus `id` or the CLI resolves through this file. A phase 1g
    decision — do not start labeling before it is made.

  subject_consent: >
    docs/plan.md §5 q1 records phase 1 as subject-initiated: a profile is generated by the
    engineer it describes. None of these ten people asked to be profiled. That is
    defensible for measuring a judge against a human label and is NOT defensible for
    publishing the output — no profile built from this corpus should be shared as a
    document about that person, and none of these rows should reach L5's share links.
