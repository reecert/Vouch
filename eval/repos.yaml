# The calibration corpus: twelve real public repos, one target author each.
#
# Selected 2026-07-26 for phase 1f; rows 11-12 added 2026-07-27. Every claim below about a
# repo's shape was MEASURED by running `vouch.l1.confounds.compute_stats` +
# `detect_confounds` — the same code the pipeline uses — against a real clone, not asserted
# from memory. The `measured:` block on each entry is that output, and `head:` pins the
# commit it was measured at.
#
# Why these twelve. The corpus has to contain each way a real history lies to the extractor,
# because a corpus of well-behaved repos would only teach us that the judge works on
# well-behaved repos. Six axes, two repos each:
#
#   solo         ownership is structurally meaningless — nobody else wrote the code, so
#                "fixes their own bugs" is the only option available. L1 suppresses
#                `ownership_loop` outright (INVALIDATING). Both picks are otherwise RICH,
#                which is the point: the judge is handed plenty of evidence and must still
#                decline on ownership specifically.
#   squash       authorship collapses to whoever merged, so the fix-then-test commit pairs
#                `ownership_loop` looks for do not exist as separate commits.
#   team         many authors, heavy PR/merge flow, individual signal diluted by review.
#   thin/stale   `insufficient_evidence` is the CORRECT answer. Not a trick: the
#                denominators genuinely are not there.
#   rich         long, active, high-volume histories where a conclusive verdict is
#                legitimately available — the control for the thin rows. Without these the
#                corpus would only reward declining.
#   target_shape THE ACTUAL USER. Every other row is an elite maintainer — 200-1200 subject
#                commits over a decade. The product's real subject is an early-career
#                engineer: a few dozen commits, an ~18-month window, a fix history you can
#                count on one hand. Nothing above measures that, so the corpus could not
#                say what the pipeline returns to the person it is FOR. Distinct from
#                `thin`, which is stale-and-abandoned (unp died 2014, records 2016): these
#                two histories are small because the career is young, not because the
#                project stopped. Both sit in large, actively-maintained, non-squash repos
#                so the axis is not confounded with `solo` or `squash`.
#
# The axes are a SAMPLING STRATEGY, NOT A PARTITION. Four repos fire
# `unresolved_identity_aliases` incidentally; `records` and `flask` fire nothing at all.
# The `measured:` block is the truth; `axis:` only records why the repo was reached for.
#
# NO ADDRESS IS STORED HERE. Each row names its subject by a SELECTOR — the n-th most
# prolific non-bot author at the pinned head, guarded by a short digest of the address —
# and `vouch.eval.corpus.resolve_author` turns that into an address by reading the clone.
# The addresses are already public in the repos they were written in; that is not a reason
# to copy ten third-party addresses into this one. See `notes.privacy` at the bottom.
#
# NO VERDICTS LIVE IN THIS FILE. Labels go in labels.yaml, written by a human through the
# blind labeling CLI, and the train/holdout split is declared there — not here — so that
# choosing the corpus and labeling it stay separate acts.

schema_version: eval/repos/1
measured_at_config: "6f2b5501a1b2"   # L1Config.fingerprint() at selection time

