      `target_shape` is not pinned to one project's conventions.
      Where wagtail's damning number survives the floor, this row's FLATTERING one does:
      `test_accompanies_fix: 0.5` off 2/4. And `ownership_loop` is suppressed at 1/1 — the
      subject genuinely did fix their own bug with a test, the single most probative thing
      in the whole corpus about this person, and the floor correctly refuses to turn one
      instance into a rate. The row therefore holds both halves of the honest trade in one
      history: the fact worth reporting is suppressed, and the fact not worth reporting is
      published.
      The cleanest row in the corpus by confound count — `detect_confounds` returns an
      empty list, and `low_denominator` is the only flag the extractor raises. Whatever a
      judge concludes here, thinness is the only thing it can be concluding from.

# ---------------------------------------------------------------------------------------
notes:
  aliases: >
    Every `aliases:` list is EMPTY on purpose, and that is a choice with consequences.
    Claiming an alias set would raise the subject's commit count and change every
    denominator, so populating it here would be quietly editing the evidence. Left empty,
    `unresolved_identity_aliases` fires (WARN, understates) on pytest, sqlite-utils and
    pyinfra, and the judge is told the count is a floor. If a later pass claims them, that
    is a different corpus and the labels do not transfer.

  finding_mailmap_is_a_no_op: >
    MEASURED, NOT ACTED ON. The question asked: three of the four non-adversarial rows
    (pytest, sqlite-utils, pyinfra) are blocked by `unresolved_identity_aliases` — does
    honouring the repo's own .mailmap collapse them? The answer is no, twice over.
    FIRST, mailmap is ALREADY honoured. `vouch.ingest._parse_commits` runs
    `git log --use-mailmap` with `%aN`/`%aE`, so every snapshot behind the `measured:`
    blocks above was mailmap-resolved before L1 saw it. There is no unhonoured mapping to
    turn on; tier 1 of identity.py's three tiers is live and has been.
    SECOND, there is almost nothing to honour. Exactly ONE of the ten repos ships a
    .mailmap at its pinned head (pytest; two lines, both naming a third party, both in the
    name-only `Proper Name <addr>` form). Its measured effect at head 36704f9b54 is zero:
    0 of 12294 commits change their (name, email) under `--use-mailmap`, 1222 distinct
    pairs either way — the two addresses it covers already carry that name in the raw log.
    Across all ten rows, distinct-author counts are identical with and without mailmap:
    0 addresses collapsed, corpus-wide. sqlite-utils and pyinfra ship no .mailmap at all
    and set no `mailmap.file`/`mailmap.blob`, so for two of the three rows in question the
    lever does not exist.
    WHAT ACTUALLY BLOCKS THE THREE ROWS is a real second address the project never
    declared: pytest 1 unclaimed address (27 commits, subject 1131 -> 1158, share 0.092 ->
    0.094), sqlite-utils 1 (38 commits, 1042 -> 1080, 0.891 -> 0.923), pyinfra 2 (279 and
    1930 commits, 1211 -> 3420, 0.278 -> 0.784 — and the larger of the two OUTRANKS the
    selected address, so the corpus selects this person's second-biggest identity).
    Claiming them clears the confound completely (residual unclaimed = 0 in all three) and
    moves every denominator — which is exactly the trade notes.aliases already described.
    So the only lever available is explicit alias claiming, and it remains a corpus
    decision, not a code fix.
    THE ONE 1g CANDIDATE THIS RAISES, stated so it is not overread: git's mailmap has two
    forms, and only `Name <canonical> <alias>` rewrites an address. That form is already
    honoured. The name-only form is still the repo's own sanctioned assertion that two
    addresses belong to one human, but the pipeline can only reach it through the
    same-display-name heuristic, which by design WARNs instead of merging — so a repo that
    declares its aliases that way is reported as unresolved rather than resolved. NOTHING
    IN THIS CORPUS EXERCISES THAT: pytest's two entries change nothing, and no row ships an
    address-rewriting entry. Building tier-1.5 on this evidence would be building on a case
    the corpus has never seen. It needs a row that actually ships such a mailmap first.
    A prevalence note worth carrying into any such decision: 1 real repo in 10 ships a
    mailmap at all, and that one is inert.

  finding_solo_threshold: >
    NOT A CODE CHANGE — reported, not acted on, because phase 1f adds no features.
    `Detection.solo_authorship_share` is 0.95. Across every real public repo probed for
    this corpus, essentially nothing reaches it: funcy 94%, hynek/doc2dash 94%,
    sqlite-utils 89%, django-cacheops 84%, shot-scraper 89%. Real single-maintainer
    projects accumulate drive-by contributors and land in the 84-94% band. The two repos
    that DO fire (98%, 99%) were found only by searching for them specifically. So in
    practice `solo_repo` fires on fixtures and near-never on the histories users will
    actually connect, and `ownership_loop` is reported unsuppressed for maintainers whose
    ownership number is nearly as meaningless as a true solo repo's. sqlite-utils is in
    the corpus precisely to put a label on that band. Do not retune the threshold before
    the labels exist — the labels are the evidence for what it should be.

  finding_commit_scoping_resolution: >
    ALSO REPORTED, NOT ACTED ON. `commit_scoping` is a median count of significant files
    per commit. Now that all ten rows have been extracted, it takes three values across the
    corpus: 1.0 on five (svcs, flask, unp, records, pyinfra), 2.0 on four (httpx, hunter,
    sqlite-utils, pytest) and 2.5 on one (black — a median over an even count need not be an
    integer). An earlier partial probe recorded "1.0 on eight of ten, 2.0 on httpx"; that was
    written before the six large rows were extracted and is superseded by this. The concern
    survives in weaker form: three values over ten real repos is coarse, so `scope_control` —
    which rests on this fact plus one L2 metric — has little room to discriminate between
    candidates. Worth knowing BEFORE reading its agreement number, so that a high
    exact-agreement score on `scope_control` is not mistaken for the dimension working.

  prediction_scope_control_agreement: >
    A PREDICTION, RECORDED BEFORE ANY LABEL EXISTS so that it cannot be rationalised
    afterwards: whatever agreement number `scope_control` scores in phase 1f, that number
    is NOT INTERPRETABLE as evidence that the dimension works. The reason is in
    notes.finding_commit_scoping_resolution — `commit_scoping` takes three distinct values
    (1.0, 2.0, 2.5) across ten real repos, and five of the ten share the single value 1.0.
    A fact that coarse cannot separate candidates, so the labels it feeds will themselves
    cluster, and a judge that lands on the modal band every time will score high exact
    agreement while discriminating nothing. High agreement here is therefore consistent
    with the dimension being inert, and cannot distinguish the two.
    What would distinguish them, and what to report instead of a bare agreement figure:
    (a) agreement measured against the majority-class baseline — the score from always
    predicting the most common `scope_control` label — with the dimension counted as
    working only if it beats that baseline by a margin the n supports; (b) the confusion
    matrix, not the diagonal, showing whether any non-modal label is ever predicted
    correctly; (c) the same two numbers for a dimension resting on a finer fact, as a
    control on the harness itself.
    If this prediction is wrong — if `scope_control` shows real spread across bands — that
    is a genuine finding about the fact's resolution and should be recorded as one. The
    prediction is here to make that outcome falsifiable, not to pre-empt it.

  prediction_target_shape: >
    A PREDICTION, WRITTEN DOWN BEFORE `extract_facts` WAS RUN on either target_shape row
    and scored here unedited, because a prediction recorded after the fact is worthless.
    PREDICTED: both rows come back insufficient across most dimensions — specifically that
    `ownership_loop`, `test_accompanies_fix` and `followup_latency` would all be
    suppressed_low_n on both rows, `revert_rate` and `commit_scoping` would be measured,
    `revert_rate` would be 0.0 on both, and `low_denominator` would fire on both.
    OUTCOME: RIGHT ON FOUR OF SIX, AND WRONG ON THE ONE THAT MATTERED.
    Correct: `ownership_loop` suppressed on both (0/0 and 1/1), `followup_latency`
    suppressed on both (0 and 2 pairs, floor 3), `commit_scoping` measured on both,
    `low_denominator` fires on both.
    Wrong, and this is the finding: `test_accompanies_fix` is MEASURED on BOTH rows — 0.0
    from 0/5 on wagtail, 0.5 from 2/4 on mitmproxy. `MinN.fix_commits` is 3, and a
    target-shape engineer has four or five fix commits, so the rate clears the floor and
    publishes. The floors were built against the "100% from n=1" failure (docs/plan.md
    §1.2e) and they stop exactly that; they do not stop 0% from n=5.
    Also wrong in the same direction: `revert_rate` is 0.0385 on mitmproxy, not 0.0 — one
    revert out of 26 commits reads as a 3.9% revert rate.
    WHAT THIS IS. A PRODUCT FINDING, NOT A BUG — every component behaved as specified.
    Verification discipline is the dimension docs/plan.md §5 q2 says should LEAD the
    report, because it is the one spanning L1 and L2 where corroboration is visible. For
    the product's actual user it will lead with a hard percentage resting on four or five
    commits, and for wagtail that percentage is zero. The failure mode the quality bar was
    written against is the flattering conclusion from weak data; this is its mirror, and
    nothing in the codebase currently treats it as the same class of error.
    DO NOT RETUNE `MinN.fix_commits` ON THIS EVIDENCE. Two rows are not a basis for a
    threshold, and raising it to 6 would suppress mitmproxy's genuine 1/1 self-fix loop
    along with the noise. The labels are the evidence for what the floor should be — the
    same discipline notes.finding_solo_threshold applies to `solo_authorship_share`.

  finding_commit_scoping_gains_a_fourth_value: >
    MEASURED, NOT ACTED ON. notes.finding_commit_scoping_resolution recorded that
    `commit_scoping` took three values across ten rows (1.0 on five, 2.0 on four, 2.5 on
    one) and warned that a fact that coarse cannot discriminate. Both target_shape rows
    measure 4.0 — a fourth value, and the highest in the corpus, on the two rows with the
    FEWEST commits. That is worth stating plainly because it runs against the intuition
    the axis was added on: these two are not thin because their commits are small, they
    are thin because there are few of them, and each one touches more files than an elite
    maintainer's median commit does. It does not rescue the fact's resolution — 12 rows
    over four values is still coarse — and it does not weaken
    prediction_scope_control_agreement, which remains the number to distrust. It does mean
    the corpus is no longer 50% clustered on a single value.

  confounds_not_covered: >
    The five original axes left four of L1's nine detectors unexercised. Adding the
    target_shape rows closed one of them: `wagtail-contrib` fires
    `rebase_rewritten_authorship` (42% of commits carry a committer/author date gap past
    the 30% threshold), incidentally rather than by design. THREE REMAIN UNEXERCISED:
    `bot_dominated`, `vendored_or_generated_bulk` and `shallow_history`. Nothing in this
    corpus licenses a claim about the judge's behaviour when those fire. Candidates seen
    while probing, if a later pass wants them: simonw/til (27% bot commits) and psf/black
    (9%).

  cost: >
    Full `extract_facts` is dominated by blame. Measured on these clones, all ten rows:
    records 0.0s, unp 1.9s, svcs 42.5s, flask 55.0s, httpx 134.5s, sqlite-utils 135.1s,
    black 193.3s, hunter 323.0s, pyinfra 484.5s, pytest 1249.9s. Roughly 45 minutes for a
    full corpus pass, and cost tracks subject commits x history size rather than either
    alone — pytest is 21 minutes on its own. The labeling harness must persist L1 output
    rather than re-extract per session; re-extracting is not a thing a human can sit
    through between labels.

  privacy: >
    SETTLED before this file was first committed, so no third-party address is anywhere in
    this repository's history. An earlier draft stored the ten addresses inline and flagged
    the problem for a decision; the decision is a runtime resolver. Each row carries a
    selector — `commit_rank` at the pinned head, guarded by `email_sha256` — and
    `vouch.eval.corpus.resolve_author` reads the address out of the clone when the pipeline
    needs it. Masking (`vouch.l1.confounds.mask_email`) was the other candidate and does not
    work here: a masked address cannot select commits, and six of the ten have no
    `users.noreply` alternative to substitute. The digest is a consistency guard, NOT a
    privacy claim — anyone with the clone can match it in seconds, which is exactly what the
    resolver does. What the digest buys is a loud failure: if the ranking shifts under the
    corpus, resolution raises instead of silently profiling a different person. What it
    costs: reading this file no longer tells you who a row is about without a clone.
    STILL OPEN, and the same leak by another door: `eval/labels.yaml` stores `author:` as a
    plain address, and the labels are committed. It is empty today, so nothing has leaked
    yet, but the first label written through the CLI puts an address in history. Either the
    label schema keys on the corpus `id` or the CLI resolves through this file. A phase 1g
    decision — do not start labeling before it is made.

  subject_consent: >
    docs/plan.md §5 q1 records phase 1 as subject-initiated: a profile is generated by the
    engineer it describes. None of these ten people asked to be profiled. That is
    defensible for measuring a judge against a human label and is NOT defensible for
    publishing the output — no profile built from this corpus should be shared as a
    document about that person, and none of these rows should reach L5's share links.
