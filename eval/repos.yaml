    axis: solo
    repo: https://github.com/ionelmc/python-hunter.git
    author:
      by: commit_rank
      rank: 1          # of 11 non-bot authors at head
      email_sha256: "1aef2e932972"
    aliases: []
    head: b29fb483a1
    measured:
      subject_commits: 1131
      human_commits: 1152
      distinct_human_authors: 11
      subject_share: 0.98
      window_days: 3812
      confounds: [solo_repo]
      facts_surviving:
        ownership_loop: not_assessable
        revert_rate: 0.002
        test_accompanies_fix: 0.244
        followup_latency: 2.0
        commit_scoping: 2.0
    why: >
      98% of human commits over 10.4 years, and the ten other contributors are drive-by
      one-commit authors. The strongest solo case found: evidence is abundant (229
      fix-keyword commits) while ownership is exactly as meaningless as in a one-commit
      repo. Separates "declines because there is little to read" from "declines because
      this particular measurement cannot mean anything here".

  - id: svcs
    axis: solo
    repo: https://github.com/hynek/svcs.git
    author:
      by: commit_rank
      rank: 1          # of 9 non-bot authors at head
      email_sha256: "4122664a9178"
    aliases: []
    head: e2e2471b38
    measured:
      subject_commits: 661
      human_commits: 669
      distinct_human_authors: 9
      subject_share: 0.99
      window_days: 1109
      confounds: [solo_repo]
      facts_surviving:   # from a full extract_facts run
        ownership_loop: not_assessable
        revert_rate: 0.002
        test_accompanies_fix: 0.164
        followup_latency: 24.0
        commit_scoping: 1.0
    why: >
      99% solo and still active (last commit 2026-07-26). Chosen as the second solo case
      because it is recent and small-scoped, where hunter is old and large — so the pair
      does not confound "solo" with "ancient". `test_accompanies_fix` measures a LOW 0.164
      here, which makes it a useful check that the judge will report a weak number as weak
      instead of rounding a solo maintainer up.

  # ---- squash-merged: authorship collapses to the merger ----------------------------
  - id: httpx
    axis: squash
    repo: https://github.com/encode/httpx.git
    author:
      by: commit_rank
      rank: 1          # of 258 non-bot authors at head
      email_sha256: "23b40f5508a1"
    aliases: []
    head: b5addb64f0
    measured:
      subject_commits: 671
      human_commits: 1335
      distinct_human_authors: 258
      squash_marker_share: 0.81
      window_days: 2357
      confounds: [squash_merge_history]
      facts_surviving:
        ownership_loop: 0.85      # 17/20 — note this SURVIVES the WARN
        revert_rate: 0.002
        test_accompanies_fix: 0.61
        followup_latency: 92.0
        commit_scoping: 2.0
    why: >
      81% of subjects carry GitHub's " (#123)" squash marker — the highest clean squash
      signal found. The important property: squash is WARN, not INVALIDATING, so
      `ownership_loop` passes through at a flattering 0.85 with only a caveat attached.
      This is the corpus's sharpest overclaim trap — a high number the reader is
      simultaneously told to discount.

  - id: black
    axis: squash
    repo: https://github.com/psf/black.git
    author:
      by: commit_rank
      rank: 2          # of 555 non-bot authors at head
      email_sha256: "cc5d4b689610"
    aliases: []
    head: db2e3e7b31
    measured:
      subject_commits: 202
      human_commits: 2088
      distinct_human_authors: 555
      squash_marker_share: 0.77
      window_days: 2933
      confounds: [squash_merge_history]
      facts_surviving:
        ownership_loop: 0.833     # 5/6 — survives the WARN on an n of 6, as httpx does on 20
        revert_rate: 0.0
        test_accompanies_fix: 0.667
        followup_latency: 62.5
        commit_scoping: 2.5
    why: >
      77% squash markers, but unlike httpx the subject is a core reviewer rather than the
      project owner (202 of 2088 human commits), and the repo has only 2 merge commits —
      a pure squash workflow. Pairs with httpx to separate "squashed" from "owns the repo".

  # ---- team with review: individual signal diluted ----------------------------------
  - id: pytest
    axis: team
    repo: https://github.com/pytest-dev/pytest.git
    author:
      by: commit_rank
      rank: 3          # of 1153 non-bot authors at head
      email_sha256: "984f7f2e5808"
    aliases: []
    head: 36704f9b54
    measured:
      subject_commits: 1131
      human_commits: 12294
      distinct_human_authors: 1153
      merge_commits: 4529
      window_days: 2505
      confounds: [unresolved_identity_aliases]
      facts_surviving:
        ownership_loop: 0.532
        revert_rate: 0.008
        test_accompanies_fix: 0.301
        followup_latency: 119.0
        commit_scoping: 2.0
    why: >
      The most team-shaped repo found: 1153 human authors, 4529 merge commits, and the
      top author holds only 16%. The subject is one core dev among many, active to
      2026-06. `unresolved_identity_aliases` fires here incidentally and is left
      unclaimed on purpose — see notes.aliases.

  - id: flask
    axis: team
    repo: https://github.com/pallets/flask.git
    author:
      by: commit_rank
      rank: 3          # of 865 non-bot authors at head
      email_sha256: "b753ea549397"
    aliases: []
    head: 36e4a824f3
    measured:
      subject_commits: 133
      human_commits: 3661
      distinct_human_authors: 865
      merge_commits: 1727
      window_days: 2213
      confounds: []          # from detect_confounds ONLY — see facts_surviving below
      facts_surviving:
        ownership_loop: suppressed_low_n   # 0/1 fix commits, under the floor of 3
        revert_rate: 0.007
        test_accompanies_fix: 0.226
        followup_latency: 0.0
        commit_scoping: 1.0
      confounds_after_extract: [low_denominator]
    why: >
      Selected as the corpus's control case — 133 commits over 6 years inside a heavily
      reviewed repo, with no confound DETECTOR firing — and a full extract has since shown
      it does not serve that role. Only ONE of the subject's fix commits reaches the
      ownership denominator, so `ownership_loop` is suppressed by the min-n floor, which
      raises `low_denominator` at extract time (that confound comes from
      `_low_denominator_confound` in the extractor, not from `detect_confounds`, which is
      why the `measured:` block above reports a clean list and is not wrong to). The
      consequence: the corpus has NO row that hands the judge an unobstructed path to a
      conclusive verdict on ownership, and the control the axis was meant to supply is
      missing. Do not read this row as one. A history that closed in 2018, so the
      target will not drift under us.

  # ---- thin / stale: insufficient_evidence is the CORRECT answer --------------------
  - id: unp
    axis: thin
    repo: https://github.com/mitsuhiko/unp.git
    author:
      by: commit_rank
      rank: 1          # of 2 non-bot authors at head
      email_sha256: "161ace72b12a"
    aliases: []
    head: 199df7b1e1
    measured:
      subject_commits: 11
      human_commits: 13
      distinct_human_authors: 2
      window_days: 0
      confounds: [low_denominator, short_window]
      facts_surviving:
        ownership_loop: suppressed_low_n
        revert_rate: 0.0          # 0/11
        test_accompanies_fix: suppressed_low_n
        followup_latency: suppressed_low_n
        commit_scoping: 1.0
    why: >
      A finished-in-two-days weekend project, dead since 2014-08-26, 5 files. Three of
      five facts are suppressed by the min-n floors before any model runs. The
      unambiguous floor of the corpus: if the judge reaches a conclusive verdict on
      ownership or verification here, that is a gross overclaim and nothing else.

  - id: records
    axis: thin
    repo: https://github.com/kennethreitz/records.git
    author:
      by: commit_rank
      rank: 3          # of 50 non-bot authors at head
      email_sha256: "506431978aad"
    aliases: []
    head: ea4273695c
    measured:
      subject_commits: 11
      human_commits: 303
      distinct_human_authors: 50
      window_days: 282
      confounds: [low_denominator]
      facts_surviving:
        ownership_loop: suppressed_low_n
        revert_rate: 0.0
        test_accompanies_fix: suppressed_low_n   # 2/2 — a real 100% the floor refuses
        followup_latency: suppressed_low_n
        commit_scoping: 1.0
    why: >
      The harder thin case, and deliberately not a clone of unp. A drive-by contributor:
      11 commits in two bursts (2016-02, 2016-11) in a repo that has since gone stale.
      `test_accompanies_fix` is 2/2 — a literal 100% that the floor suppresses rather
      than rounds, which is precisely the "100% from n=1" failure the floors exist for.
